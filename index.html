    <script>
      // Apply the saved theme (see src/theme.ts) before the first paint, so it doesn't flash.
      try {
        var theme = localStorage.getItem("theme");
        if (
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        )
          document.documentElement.classList.add("dark");
      } catch (error) {}
    </script>

        offline. Signing in with Google is optional and backs up your progress
